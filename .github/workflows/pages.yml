# Publishes the scenarios to GitHub Pages: a landing page that sets the scene, and Cucumber's own HTML
# report of the feature files behind it.
#
# Replaces the default workflow, which uploaded `path: '.'` - the entire repository. That published the
# raw source tree rather than anything built, and would have served no report at all.

name: Publish the scenarios to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let an in-progress one finish rather than cancelling it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # The scenarios write fxtivity-example/target/cucumber/scenarios.html as they run, so running them IS building the
      # report. Deliberately NOT continue-on-error, unlike foxglove's dashboard: there a failure is the
      # content worth publishing, whereas here the report is documentation and a red specification is worse
      # than yesterday's green one.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run the scenarios, which write the report
        # fxtivity-example, where the scenarios are, and the modules it is built on - whose tests include the controls',
        # which start the toolkit and so need a display, as in CI.
        run: xvfb-run --auto-servernum mvn -B --no-transfer-progress test -pl fxtivity-example -am

      - name: Assemble the site
        run: |
          if [ ! -f fxtivity-example/target/cucumber/scenarios.html ]; then
            echo "::error::fxtivity-example/target/cucumber/scenarios.html was not produced - has the html plugin been removed from RunCucumberTest?"
            exit 1
          fi
          mkdir -p target/site
          cp fxtivity-example/src/site/index.html target/site/index.html
          cp fxtivity-example/target/cucumber/scenarios.html target/site/scenarios.html
          echo "Site assembled:"
          ls -l target/site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
