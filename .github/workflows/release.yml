# Publishes a tagged release to the Maven Central Portal.
#
# Tag a commit whose pom version has had -SNAPSHOT removed, and whose tag equals that version:
#
#     mvn versions:set -DnewVersion=1.0.0 -DprocessAllModules=true && git commit -am "Release 1.0.0"
#     git tag 1.0.0 && git push origin master 1.0.0
#
# The deployment is staged on the Portal rather than published automatically - see autoPublish in the pom -
# so the last step of a release is always a deliberate one taken by hand.
#
# Run this by hand in "rehearse" mode before a tag depends on it. A re-run uses the workflow as it existed
# at the tagged commit, so a problem found at tag time cannot be fixed by landing a correction on master:
# it needs a fresh tag. Rehearsing is much cheaper than discovering that.

# A tag pushed by the release train publishes straight through rather than staging, because the train has
# already had its approval (ctggames/release-train#6). Every run, rehearsal or release, lists the files it
# would publish or did publish as release-artifacts.txt, in the run summary and as a workflow artifact, so
# the train can compare a release with its rehearsal.

name: Release to Maven Central

# Needed by the final step, which creates the GitHub release. This repository's default workflow
# token is read-only, so without this the publish succeeds and then the release call 403s - which
# is how yaml-flock 1.0.0 shipped to the Portal with no GitHub release beside it (ctggames/yaml-flock#15).
# Declared here rather than widening the repository-wide setting: it grants the one workflow the one
# permission, and it travels with the file, so a fork behaves the same without anyone knowing about a
# setting in a UI.
permissions:
  contents: write

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          "rehearse" builds and signs exactly as a real release would, then stops - nothing reaches the
          Portal and no GitHub release is created. It proves the build, the javadoc, and the GPG_PRIVATE_KEY
          and GPG_PASSPHRASE secrets. It cannot prove CENTRAL_USERNAME and CENTRAL_PASSWORD, which are only
          read when something is actually uploaded. "publish" does the real thing against the current pom
          version.
        type: choice
        options: [rehearse, publish]
        default: rehearse

jobs:
  release:
    # Pinned rather than floating, matching jmsfx: a release should build on a known image rather than on
    # whatever the label points at that week, and maven.yml already runs on the floating label so a new
    # image's problems surface in CI first. Bump this deliberately.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'
        # Writes a settings.xml carrying a 'central' server whose credentials come from the environment,
        # and imports the signing key. The publishing plugin resolves that server before it does anything
        # else, so without this the build fails on a null server rather than on a rejected upload.
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    # Maven 3.10, which the ubuntu-24.04 image carries from 20261002, writes maven-metadata-local.xml and
    # _remote.repositories into the publishing plugin's staging directory; the plugin bundles them, and
    # Central rejects the bundle with "does NOT have a .pom file" - which is what failed foxglove 0.13.0
    # twice and jmsfx 2.0.1 once (#52). Pinned to 3.9.16, checked against its published SHA-512, until
    # central-publishing-maven-plugin copes with 3.10 (0.11.0 does not); remove this step then.
    - name: Use Maven 3.9.16
      run: |
        version=3.9.16
        curl -sSfL -o "$RUNNER_TEMP/maven.tar.gz" \
          "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$version/apache-maven-$version-bin.tar.gz"
        echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
        tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-$version/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/apache-maven-$version/bin/mvn" -v

    # foxglove 0.9.5 was tagged with -SNAPSHOT still in the pom, so it built snapshot artifacts, failed to
    # deploy, and still produced a GitHub release for a version that never reached Central. Fail before
    # building anything instead. Skipped on a manual run, where the pom is expected to be a snapshot.
    - name: Verify the tag names a release version
      if: github.event_name == 'push'
      run: |
        VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tail -n1)
        echo "tag:         $GITHUB_REF_NAME"
        echo "pom version: $VERSION"
        case "$VERSION" in
          *-SNAPSHOT)
            echo "::error::pom version $VERSION is a snapshot - remove -SNAPSHOT before tagging a release"
            exit 1
            ;;
        esac
        if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match pom version $VERSION"
          exit 1
        fi

    # A tag pushed by the release train has already had its approval, so it publishes straight through and
    # waits until Central reports it published. Any other tag, and a manual "publish", stages a validated
    # deployment for a person to publish in the Portal, as before. The train's bot account is named in the
    # RELEASE_TRAIN_BOT organisation variable; while that is unset, every release stages.
    - name: Decide how the release reaches Central
      id: publish
      env:
        TRAIN_BOT: ${{ vars.RELEASE_TRAIN_BOT }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$TRAIN_BOT" ] && [ "$GITHUB_ACTOR" = "$TRAIN_BOT" ]; then
          echo "Tag pushed by the release train ($GITHUB_ACTOR): publishing automatically."
          echo "auto=true" >> "$GITHUB_OUTPUT"
          echo "wait=PUBLISHED" >> "$GITHUB_OUTPUT"
        else
          echo "Staging a validated deployment, to be published in the Portal."
          echo "auto=false" >> "$GITHUB_OUTPUT"
          echo "wait=VALIDATED" >> "$GITHUB_OUTPUT"
        fi

    # fxtivity-controls' tests start the JavaFX toolkit, which needs a display: both builds below run
    # under Xvfb, as CI does.
    - name: Install Xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    # Everything a release does except the two steps that cannot be undone. install rather than verify, so
    # the artifacts land in the local repository in the layout a real release stages them in, for the
    # artifact list below.
    - name: Rehearse the release build
      if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rehearse'
      run: xvfb-run --auto-servernum mvn -B --no-transfer-progress -Prelease install
      env:
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    # Tests are not skipped here, unlike foxglove, which skips them because JavaFX blocks forever on a
    # display-less runner. The controls' tests run under Xvfb instead, and the whole suite takes seconds, so
    # there is no reason to ship artifacts that were not tested on the exact commit being released.
    - name: Publish to the Maven Central Portal
      if: github.event_name == 'push' || inputs.mode == 'publish'
      run: >-
        xvfb-run --auto-servernum mvn -B --no-transfer-progress -Prelease deploy
        -Dcentral.autoPublish=${{ steps.publish.outputs.auto }}
        -Dcentral.waitUntil=${{ steps.publish.outputs.wait }}
      env:
        MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    # The files a release publishes, or a rehearsal would publish, in repository layout without signatures
    # or checksums: what the release train compares with its own rehearsal. A real release lists what the
    # publishing plugin staged; a rehearsal lists what it installed locally. Either way the list holds only
    # this repository's own modules, read from its poms, less any the poms' excludeArtifacts keep off
    # Central: a local repository also holds other ctggames artifacts, from the cache or from a whole-train
    # rehearsal, and a sibling library can share this version number. An empty list fails the step, so a
    # change in either layout cannot pass unnoticed as "nothing to compare".
    - name: List the release artifacts
      run: |
        VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tail -n1)
        GROUP=$(mvn -q -B help:evaluate -Dexpression=project.groupId -DforceStdout 2>/dev/null | tail -n1 | tr . /)
        STAGING=$(find . -type d -path '*/target/central-staging' | head -n1)
        ROOT=${STAGING:-$HOME/.m2/repository}
        MODULES=$(python3 - <<'PY'
        import pathlib, xml.etree.ElementTree as ET
        ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
        modules, excluded = set(), set()
        for pom in pathlib.Path('.').rglob('pom.xml'):
            if 'target' in pom.parts:
                continue
            root = ET.parse(pom).getroot()
            modules.add(root.find('m:artifactId', ns).text)
            excluded.update(e.text for e in root.iter('{%s}excludeArtifact' % ns['m']))
        print('|'.join(sorted(modules - excluded)))
        PY
        )
        echo "Listing $GROUP at $VERSION from $ROOT, for: $MODULES"
        (cd "$ROOT" && find "$GROUP" -type f -path "*/$VERSION/*") \
          | grep -E "^$GROUP/($MODULES)/$VERSION/" \
          | grep -vE '\.(asc|md5|sha1|sha256|sha512)$|/maven-metadata[^/]*$|/_remote\.repositories$|\.lastUpdated$' \
          | sort > release-artifacts.txt || true
        if [ ! -s release-artifacts.txt ]; then
          echo "::error::no artifacts found for $GROUP ($MODULES) at $VERSION under $ROOT"
          exit 1
        fi
        cat release-artifacts.txt
        {
          echo "### Release artifacts: $VERSION"
          echo '```'
          cat release-artifacts.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the artifact list
      uses: actions/upload-artifact@v7
      with:
        name: release-artifacts
        path: release-artifacts.txt

    # After the publish, so a failed deploy cannot leave a release announcing a version that is not on
    # Central. Tag pushes only: on a manual "publish" run there is no tag for a release to describe, and
    # the action would name one after the branch instead.
    - name: Create release
      if: github.event_name == 'push'
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        # The published modules' jars, named one by one: fxtivity-example builds jars too, and is never
        # published, so a wildcard over fxtivity-* would attach it here. The parent publishes only a pom.
        artifacts: "${{ github.workspace }}/fxtivity-core/target/*.jar,${{ github.workspace }}/fxtivity-controls/target/*.jar"
        token: ${{ secrets.GITHUB_TOKEN }}
